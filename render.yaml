services:
  - type: web
    name: elite-placo-api-oregon
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /actuator/health
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: elite-placo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: elite-placo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: elite-placo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: elite-placo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: elite-placo-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://eliteplacodeco.cm,https://elite-placo-site.onrender.com,https://elite-placo-app.onrender.com,https://elite-placo-site-9q65.onrender.com,https://elite-placo-app-9q65.onrender.com,https://elite-placo-site-static.onrender.com,https://elite-placo-app-static.onrender.com
      - key: APP_DEMO_ENABLED
        value: "true"

  - type: web
    name: elite-placo-site
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    healthCheckPath: /

  # Frontend React servi par le CDN Render, sans mise en veille du conteneur.
  - type: web
    runtime: static
    name: elite-placo-site-static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://elite-placo-api-oregon-9q65.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # Flutter Web est construit par GitHub Actions sur deploy-app.
  - type: web
    runtime: static
    name: elite-placo-app-static
    branch: deploy-app
    buildCommand: echo "Flutter Web artifact already built by GitHub Actions"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: elite-placo-app
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: apps/mobile/Dockerfile
    dockerContext: apps/mobile
    healthCheckPath: /

databases:
  - name: elite-placo-db
    region: oregon
    databaseName: eliteplaco
    user: eliteplaco
    plan: free
