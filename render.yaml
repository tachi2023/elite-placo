services:
  # --- Backend API (Spring Boot / Docker) ---
  - type: web
    name: elite-placo-api-oregon
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    healthCheckPath: /
    envVars:
      - key: JAVA_VERSION
        value: 17
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: elite-placo-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: elite-placo-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: elite-placo-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: elite-placo-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: elite-placo-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        value: https://eliteplacodeco.cm,https://elite-placo-site-static.onrender.com,https://elite-placo-app-static.onrender.com
      - key: APP_DEMO_ENABLED
        value: "false"

  # --- Site Vitrine (React Static CDN — gratuit, rapide, pas de mise en veille) ---
  - type: web
    runtime: static
    name: elite-placo-site-static
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://elite-placo-api-oregon.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Flutter Web App (Static CDN — construit par GitHub Actions) ---
  - type: web
    runtime: static
    name: elite-placo-app-static
    branch: deploy-app
    buildCommand: echo "Flutter Web artifact already built by GitHub Actions"
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: elite-placo-db
    region: oregon
    databaseName: eliteplaco
    user: eliteplaco
    plan: free
