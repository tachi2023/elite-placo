# ============================================================================
# Configuration Spring Boot — Élite Placo & Déco
# Les valeurs sensibles viennent de variables d'environnement (jamais en dur)
# ============================================================================

spring.application.name=elite-placo-api
server.port=${PORT:8080}

# --- Base de données PostgreSQL / H2 (Fallback local) ---
spring.datasource.url=jdbc:h2:mem:eliteplaco;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# Clé secrète : à définir en variable d'environnement, jamais commitée.
app.jwt.secret=${JWT_SECRET:CHANGEZ_MOI_EN_PRODUCTION}
# Jeton d'accès : courte durée de vie (30 minutes)
app.jwt.access-token-expiration-ms=1800000
# Jeton de rafraîchissement : longue durée de vie (30 jours), pensé pour un
# usage terrain hors-ligne prolongé (cf. elite.md §3 et §10.12-A3)
app.jwt.refresh-token-expiration-ms=2592000000

# --- CORS (restreint au client Flutter, à adapter selon l'environnement) ---
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5000,https://eliteplacodeco.cm}
spring.flyway.enabled=false
