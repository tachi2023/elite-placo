# ============================================================================
# Base de données locale de développement pour Élite Placo & Déco.
# Usage : docker compose up -d   (depuis le dossier elite-placo/)
#         docker compose down    (pour tout arrêter)
#         docker compose down -v (pour tout arrêter ET effacer les données)
# ============================================================================
services:
  db:
    image: postgres:16-alpine
    container_name: elite_placo_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eliteplaco
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - elite_placo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d eliteplaco"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    image: elite-placo-api:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/eliteplaco
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: changeme
      JWT_SECRET: change_me_secure
      CORS_ORIGINS: http://localhost:3000,http://localhost:5000
    ports:
      - "8081:8080"

  site:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8081
    image: elite-placo-site:dev
    ports:
      - "3000:80"
    environment:
      VITE_API_URL: http://localhost:8081

  app-web:
    build:
      context: ./apps/mobile
      dockerfile: Dockerfile
      args:
        API_BASE_URL: http://localhost:8081
    image: elite-placo-app:dev
    ports:
      - "5000:80"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: elite_placo_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@eliteplaco.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - elite_placo_pgadmin_data:/var/lib/pgadmin

volumes:
  elite_placo_db_data:
  elite_placo_pgadmin_data:
