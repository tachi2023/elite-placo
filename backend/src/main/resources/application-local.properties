# Local development profile using embedded H2
spring.datasource.url=jdbc:h2:mem:elitedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for local in-memory DB
spring.flyway.enabled=false

# Let Hibernate create schema for dev
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Server port
server.port=8081

# JWT fallback for dev
app.jwt.secret=elite-placo-local-jwt-secret-2026-change-before-production-strong-key

# Local frontend origins
app.cors.allowed-origins=http://localhost:3000,http://localhost:5000,http://10.172.104.227:3000,http://10.172.104.227:5000,https://eliteplacodeco.cm

# Local actuator info
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# H2 console for local database visualization
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
