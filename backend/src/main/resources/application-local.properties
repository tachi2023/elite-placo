# Local development profile using embedded H2 (fallback)
spring.datasource.url=jdbc:h2:mem:elitedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Disable Flyway for local in-memory DB to avoid PG-specific migrations
spring.flyway.enabled=false

# Let Hibernate create schema for dev
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# Server port (kept default)
server.port=8080

# JWT fallback for dev
app.jwt.secret=DEV_JWT_SECRET

# Autoriser l'origin du site-vitrine local (Vite) pour le développement
app.cors.allowed-origins=http://localhost:5173,http://localhost:5000,https://eliteplacodeco.cm

# Actuator — exposition minimale utile en local
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
