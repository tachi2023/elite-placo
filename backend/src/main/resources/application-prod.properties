# ============================================================================
# Configuration Spring Boot — PRODUCTION (Render.com)
# Toutes les valeurs sensibles viennent des variables d'environnement Render
# ============================================================================

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Hibernate — Flyway gère le schéma, on ne laisse pas Hibernate y toucher
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway — actif en production
spring.flyway.enabled=true

# Logging minimal en production
logging.level.root=WARN
logging.level.com.eliteplaco=INFO
