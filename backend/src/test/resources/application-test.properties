# Profil de test — base isolée, ne touche jamais aux données réelles.
# Usage : lancer les tests avec -Dspring.profiles.active=test
spring.datasource.url=jdbc:h2:mem:elite_placo_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
