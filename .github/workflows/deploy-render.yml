name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ secrets.RENDER_DEPLOY_HOOK_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
