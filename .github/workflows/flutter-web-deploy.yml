name: Build and publish Flutter Web

on:
  push:
    branches: [jour-4]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: https://elite-placo-api-oregon-9q65.onrender.com
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable

      - name: Build Flutter Web
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter build web --release --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Publish generated files to deploy-app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/flutter-web"
          cp -R apps/mobile/build/web/. "$RUNNER_TEMP/flutter-web/"
          if git show-ref --verify --quiet refs/remotes/origin/deploy-app; then
            git switch --track origin/deploy-app
            git rm -rf .
          else
            git switch --orphan deploy-app
            git rm -rf .
          fi
          cp -R "$RUNNER_TEMP/flutter-web/." .
          touch .nojekyll
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "chore: publish Flutter web artifact"
          git push origin deploy-app
