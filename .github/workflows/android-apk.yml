name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-apk.yml'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --no-shrink --dart-define=API_BASE_URL=https://elite-placo-api-oregon.onrender.com

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: elite-placo-android-release
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
